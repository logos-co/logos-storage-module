                    "spr:CiUIAhIhAiwKmSwu6gxwCcUU_EeE8dPdE_GJDlw17E5qORPHvjflEgIDARpHCicAJQgCEiECLAqZLC7qDHAJxRT8R4Tx090T8YkOXDXsTmo5E8e-N-UQyeiN0gYaCgoIBCI7UnMGH5AaCgoIBCI7UnMGH5AqRjBEAiBoss-6Bel-mSmeEAhWoF0VbIJ_TwEKBmeWDTy7RhCKaQIgByK8s5__HQ1iYxBL_1_iHiq0mfowhtTbntKBCL6F7PY",
                    "spr:CiUIAhIhAuc7v0KnrAyWlwcAw72SvOxVDRG0yAA3ldfwAz6ArdCOEgIDARpHCicAJQgCEiEC5zu_QqesDJaXBwDDvZK87FUNEbTIADeV1_ADPoCt0I4Qy-WN0gYaCgoIBC_u5W8GH5AaCgoIBC_u5W8GH5AqRzBFAiEA_23ADTmzzORJAxsGTt3apZi1J_Y9JPbTuCmbdzFAUlcCIEsnRXEKWLZKj0XgRSu5JVX8m51n4fCLv4L8JdNQn7Rj",
                    "spr:CiUIAhIhAm-BN7CX8n1CSWBqCX76J1ppr8R8Zwd0a6SVEZeiHvvSEgIDARpHCicAJQgCEiECb4E3sJfyfUJJYGoJfvonWmmvxHxnB3RrpJURl6Ie-9IQvueN0gYaCgoIBC9WIsoGH5AaCgoIBC9WIsoGH5AqRjBEAiAVW8C1zXUFM-dEq_RFdINy2EuxJHzm-OYpbpVCGX7R4AIgJ3T_qtFtEBY0-UCWEVxxpbJ-HYXq4yf8YmoH84nEcyM"
                  ],
                  "mix-pool-json": "{\"version\":1,\"relays\":[{\"peerId\":\"16Uiu2HAmJwAxtuRLfjP1SfjE7EWWr6zExFBFVLnUnTsc28fmvrpq\",\"mixPubKey\":\"d2bad8ab91f9a63c8a60b1e305fc1045224891ed00719ada2991abe9bc627540\",\"libp2pPubKey\":\"035d4b6a696cc1ba11972ae911706e6cf400af65919aa8e05910b826cbc5a6dac2\",\"multiAddr\":\"/ip4/24.144.78.200/tcp/8080\"},{\"peerId\":\"16Uiu2HAmGJx2MWRH66M2A1RcD5TcY5Z2kReNdddpF9kRyfykBFwy\",\"mixPubKey\":\"410d987b608e5164ec1748b964a0ee6d636af4e62667a5a207e7fd766ec42268\",\"libp2pPubKey\":\"03364c803faa8c97b9b652a34a817bf2aa3b30ce2cc5148b58f9a09327bd47a62c\",\"multiAddr\":\"/ip4/188.166.200.119/tcp/8080\"},{\"peerId\":\"16Uiu2HAmDF8zGjsuxM4h1N5x37hzUtGnDHtkVJ8jLiVty1DJyG92\",\"mixPubKey\":\"0a9b87d4a03fca9ffd9b0d7b21dd9950741f08d72fc0716bf79c8ad83e702e34\",\"libp2pPubKey\":\"0308bf839c479a7f9a2def4e54cc4e681003a648e6dae89022d1797146c2a8b43d\",\"multiAddr\":\"/ip4/34.42.230.59/tcp/8080\"},{\"peerId\":\"16Uiu2HAkxPbHtGidyULiTjtzRRfSbEL2DPX5cr8HgpvHsjA2T1WL\",\"mixPubKey\":\"11fcb95bfe9932339eae0aeef85ecd7b51299a91a6c9ff58f8a1d7d423331614\",\"libp2pPubKey\":\"022c0a992c2eea0c7009c514fc4784f1d3dd13f1890e5c35ec4e6a3913c7be37e5\",\"multiAddr\":\"/ip4/34.59.82.115/tcp/8080\"},{\"peerId\":\"16Uiu2HAmAzJztKiAAMSixFAhUjfWdKB3bGcXGfDFqaut6nc5PTRf\",\"mixPubKey\":\"04dddf75ad5090f8975836f8617b7b87cf926a7f2938a5059c9f5e0000509513\",\"libp2pPubKey\":\"02e73bbf42a7ac0c96970700c3bd92bcec550d11b4c8003795d7f0033e80add08e\",\"multiAddr\":\"/ip4/47.238.229.111/tcp/8080\"},{\"peerId\":\"16Uiu2HAm2vwWq3aoJsdk5ovigGJjDL7xDvXFckEyknpJzBL7YENd\",\"mixPubKey\":\"cda3b372494a7310c214b2d58644d95410af9878740a0bfe8e998483819d755b\",\"libp2pPubKey\":\"026f8137b097f27d4249606a097efa275a69afc47c6707746ba4951197a21efbd2\",\"multiAddr\":\"/ip4/47.86.34.202/tcp/8080\"}]}"
                }
              screenshot: "storage-ui-advanced-mode-newconf.png"

            - name: "Editor reports the config valid"
              action: expect_property
              find_by: "objectName"
              find_value: "configEditor"
              property: "isValid"
              value: true
              text: |
                The valid configuration used contains the network "logos.dev" which is
                used to connect to the Logos network using bootstrap nodes.
                Once you are connected, you can share files across the network.

            - name: "Screenshot: editor report success"
              action: sleep
              screenshot: "storage-ui-valid-json.png"
              ms: 1000

            - name: "Validate the config"
              action: call_method
              find_by: "text"
              find_value: "Validate"
              method: "clicked"

            - name: "Onboarding reaches the drive-selection step"
              action: wait_for
              texts: ["Select Drives"]
              timeout: 10000
              text: |
                After your configuration is done, the onboarding will ask about
                the drives you want to use. This is the default folder which
                will be used to store your data.

            - name: "Screenshot: drive selection"
              action: sleep
              screenshot: "storage-ui-select-drives.png"
              ms: 1000

            - name: "Finish onboarding"
              action: call_method
              find_by: "objectName"
              find_value: "downloadFolderContinue"
              method: "clicked"

            - name: "Dashboard opens"
              action: wait_for
              texts: ["Manage node", "Total space available"]
              timeout: 30000

            - name: "Node reaches Running (UI drove init + start through the module)"
              action: wait_for
              texts: ["Running"]
              timeout: 30000
              screenshot: "storage-ui-dashboard.png"
              text: |
                The dashboard opens after the node reaches the Running state.
                The red color indicates that the node is started but not reachable.
                A green color indicates that the node is reachable and ready to share files.

            - name: "Hand the file to the upload dialog"
              action: set_property
              find_by: "objectName"
              find_value: "uploadDialog"
              property: "selectedFile"
              value: "file:///tmp/storage-ui-upload.txt"

            - name: "Fire the dialog's accepted signal (drives backend.uploadFile through the module)"
              action: call_method
              find_by: "objectName"
              find_value: "uploadDialog"
              method: "accepted"

            - name: "Upload completes (the file appears in the manifest list)"
              action: wait_for
              texts: ["storage-ui-upload.txt"]
              timeout: 30000
              screenshot: "storage-ui-uploaded.png"
              text: |
                To upload a file, you first need to select it from your filesystem by clicking on
                "Click to browse".
                After the upload completes, a CID of your file should appear in the manifest list.
                This CID can be shared with others in your network to download your file if you are reachable.

            - name: "Paste the file's CID into Fetch Manifest"
              action: set_property
              find_by: "placeholderText"
              find_value: "CID"
              property: "text"
              value: "zDvZRwzkwNFfEiGD9jgHDs2JfmGfNfkeyecphFEtq5J9cWiVLGF7"

            - name: "Fetch the manifest by CID"
              action: call_method
              find_by: "text"
              find_value: "Fetch"
              method: "clicked"

            - name: "Let the fetch run"
              action: sleep
              ms: 15000

            - name: "Click the manifest row's download button"
              action: click_object
              find_by: "objectName"
              find_value: "downloadButton"

            - name: "Let the download run"
              action: sleep
              ms: 5000

            - name: "Download completes (UI reports it done)"
              action: expect_property
              find_by: "objectName"
              find_value: "downloadWidget"
              property: "isDone"
              value: true
              screenshot: "storage-ui-downloaded.png"
              text: |
                To download a file, you first fetch its manifest by pasting the CID
                into the Fetch Manifest field and clicking Fetch. The manifest is the
                representation of the file — it carries the metadata (filename, size...)
                — and appears in the manifest list below.
                Each row then has a download icon that streams the blocks back out of
                the node and writes the file to the downloads folder. When it finishes,
                the download widget reports it done.

            - name: "Delete the file from the manifest"
              action: click_object
              find_by: "objectName"
              find_value: "deleteButton"

            - name: "Storage frees up (file removed through the module)"
              action: wait_for
              texts: ["0 B Utilized"]
              timeout: 30000
              screenshot: "storage-ui-deleted.png"
              text: |
                The file leaves the manifest list and the node's used space falls
                back to **0 B Utilized** — the blocks were really dropped, closing
                the upload → download → delete round-trip.

            - name: "Privately download a public file with Mix"
              action: expect_property
              find_by: "text"
              find_value: "Mix"
              property: "checked"
              value: true
              text: |
                So far we have been playing around with a local file. We are now going
                to do another download, but of a public file this time. And we are going
                to leverage the new "private query" feature to do that. Private
                queries can be enabled or disabled by toggling the "Mix" switch.
                When enabled (default), the node will forward DHT queries over the
                Logos mix network, which makes those much harder to trace back to you.
                The file we will be downloading is the
                [Farewell to Westphalia book](https://logos.co/farewell-to-westphalia).

            - name: "Disable private queries"
              action: click_object
              find_by: "text"
              find_value: "Mix"

            - name: "Show private queries are disabled"
              action: expect_property
              find_by: "text"
              find_value: "Mix"
              property: "checked"
              value: false
              text: |
                Private queries can be slower, and may fail more often than non-private ones.
                When downloading content that is not sensitive, you can always toggle the switch
                by clicking it. This will allow observers to link you to your queries.
              screenshot: "storage-ui-mix-disabled.png"

            - name: "Re-enable private queries"
              action: click_object
              find_by: "text"
              find_value: "Mix"

            - name: "Show private queries are enabled"
              action: expect_property
              find_by: "text"
              find_value: "Mix"
              property: "checked"
              value: true
              text: |
                Here we want to use mix, so we will keep this enabled.
              screenshot: "storage-ui-mix-enabled.png"

            - name: "Paste the public file's CID into Fetch Manifest"
              action: set_property
              find_by: "placeholderText"
              find_value: "CID"
              property: "text"
              value: "zDvZRwzkzrrYB6sS1rRpRLt4gBhc1pWoyTSjkfszfmj1seaYYLCZ"
              is_step: true

            - name: "Fetch the manifest by CID"
              action: call_method
              find_by: "text"
              find_value: "Fetch"
              method: "clicked"
              is_step: true

            - name: "Let the fetch run"
              action: sleep
              ms: 60000

            - name: "Click the manifest row's download button"
              action: click_object
              find_by: "objectName"
              find_value: "downloadButton"
              is_step: true

            - name: "Let the download run"
              action: sleep
              ms: 30000
              is_step: true

            - name: "Download completes (UI reports it done)"
              action: expect_property
              find_by: "objectName"
              find_value: "downloadWidget"
              property: "isDone"
              value: true
              is_step: true
              screenshot: "storage-ui-private-query-downloaded.png"
              text: |
                The remained of the download procedure remains as before - paste the CID,
                fetch the manifest, and download the file. The node will again show that
                the download is complete when it is done.

            - name: "Check that we actually engaged the mix network"
              run: 'grep -q "Selected mix node" ui-test-app.log'

            - name: "Stop the node"
              action: click
              target: "Stop"

            - name: "Node reports Stopped"
              action: wait_for
              texts: ["Stopped"]
              timeout: 30000
              screenshot: "storage-ui-stopped.png"
              text: |
                You can stop the node by clicking the Stop button.
                The node status icon indicator will become grey and you
                should not see any peers.

            - name: "Start the node again"
              action: click
              target: "Start"

            - name: "Node reaches Running again"
              action: wait_for
              texts: ["Running"]
              timeout: 30000

            - name: "The uploaded file survived the restart"
              action: wait_for
              texts: ["farewell-to-westphalia-foss-edition.pdf"]
              timeout: 60000
              text: |
                Because the node persists the data into a data dir configured earlier,
                the uploaded file survives the stop/start cycle.

            - name: "Delete the file from the manifest"
              action: click_object
              find_by: "objectName"
              find_value: "deleteButton"

            - name: "Storage frees up (file removed through the module)"
              action: wait_for
              texts: ["0 B Utilized"]
              timeout: 30000
              screenshot: "storage-ui-deleted.png"
              text: |
                Once again the file leaves the manifest list and the node's used space
                goes back to **0 B Utilized**, signaling that the delete went through.

        post_text: |
          This is a real end-to-end lifecycle driven entirely from the QML UI.
          On every interaction, the Storage UI calls the storage module using its
          exposed API, example: `storage_module.remove()`.

          The captured screenshots are embedded above and in the CI report.

  - title: "Verify the downloaded file on disk"
    step: true
    text: |
      The UI wrote the download to its configured downloads folder (the home
      directory by default). We confirm the bytes actually landed and match what we
      uploaded — a full store-and-retrieve round-trip through the module.
    steps:
      - title: "Check the round-tripped file"
        run: 'grep -q "hello from the storage UI doctest" "$HOME/storage-ui-upload.txt" && echo "round-trip OK"'
      - title: "Check the public file"
        run: |
          if [ "$(uname)" = "Darwin" ]; then
            file_size=$(stat -f%z "$HOME/farewell-to-westphalia-foss-edition.pdf")
          else
            file_size=$(stat -c%s "$HOME/farewell-to-westphalia-foss-edition.pdf")
          fi
          if [ "$file_size" -ne 2276462 ]; then
            echo "public file size mismatch: $file_size"
            exit 1
          fi
          echo "public file OK"
