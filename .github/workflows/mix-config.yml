name: mix-config.json

# The Mix relays this module ships (mix-config.json) are generated by hand with
# tools/gen-mix-config.sh. This job compares the committed file with the generated
# one to ensure it is up to date.

on:
  pull_request:
    branches: [master, main]

concurrency:
  group: mix-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: mix-config.json is up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep the committed file aside
        run: cp mix-config.json /tmp/mix-config.committed.json

      - name: Regenerate from the live fleet data
        run: ./tools/gen-mix-config.sh

      - name: Compare the Mix configurations
        run: |
          set -e
          committed=/tmp/mix-config.committed.json
          live=mix-config.json
          fix="Run ./tools/gen-mix-config.sh and commit the result."

          # The relay pool of every network, one per line.
          jq -r '.[]["mix-pool-json"]' "$committed" > /tmp/pools-committed.txt
          jq -r '.[]["mix-pool-json"]' "$live"      > /tmp/pools-live.txt

          if ! diff /tmp/pools-committed.txt /tmp/pools-live.txt; then
            echo "::error file=mix-config.json::The relay pool changed. $fix"
            exit 1
          fi

          # The proxy SPRs change on every reboot, so they cannot be compared.
          # So we just compare the count.
          jq -r '.[]["dht-mix-proxy"] | length' "$committed" > /tmp/proxy-count-committed.txt
          jq -r '.[]["dht-mix-proxy"] | length' "$live"      > /tmp/proxy-count-live.txt

          if ! diff /tmp/proxy-count-committed.txt /tmp/proxy-count-live.txt; then
            echo "::error file=mix-config.json::The fleet gained or lost a proxy. $fix"
            exit 1
          fi

          echo "mix-config.json is current"
