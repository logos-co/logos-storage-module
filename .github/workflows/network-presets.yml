name: network-presets.json

on:
  pull_request:
    branches: [master, main]

concurrency:
  group: network-presets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: network-presets.json is up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep the committed file aside
        run: cp network-presets.json /tmp/network-presets.committed.json

      - name: Regenerate the presets
        run: ./tools/gen-network-presets.sh

      - name: Compare the network presets
        run: |
          if ! diff /tmp/network-presets.committed.json network-presets.json; then
            echo "::error file=network-presets.json::The fleet changed. Run ./tools/gen-network-presets.sh and commit the result."
            exit 1
          fi

          echo "network-presets.json is up to date"
