name: Claude

# Claude on a pull request, only when someone with write access calls it: a
# comment holding "@claude" ("@claude review this PR"). It runs on Arnaud's
# Claude subscription through the CLAUDE_CODE_OAUTH_TOKEN secret, made with
# `claude setup-token`. It follows CLAUDE.md, posts what it finds as comments,
# and cannot push.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # A comment on a pull request, never on an issue.
    if: |
      contains(github.event.comment.body, '@claude') &&
      (github.event_name == 'pull_request_review_comment' ||
       github.event.issue.pull_request)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Read and comment only: a PR's text could try to steer it.
          # The inline comment tool puts each problem on its line of the diff.
          # The action's own prompt asks for one long comment, and it wins over
          # CLAUDE.md: the appended prompt tells it to follow "Reviews" instead.
          # Opus at high effort: a review is worth the time it takes.
          claude_args: >-
            --model claude-opus-5-5
            --effort high
            --disallowedTools Edit,Write,NotebookEdit
            --allowedTools mcp__github_inline_comment__create_inline_comment
            --append-system-prompt "For a review, follow the Reviews section
            of CLAUDE.md exactly, and nothing else. Post each problem on its
            line with mcp__github_inline_comment__create_inline_comment and
            confirmed set to true. Your own comment holds only the checklist,
            with no other section."
